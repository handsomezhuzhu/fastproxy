name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: instabox-medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build web (shadcn UI)
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: DOM smoke test (black-screen guard)
        run: cd web && node scripts/smoke-dom.mjs

      - name: Vet
        run: go vet ./...

      # -tags with_utls: embedded sing-box compiles REALITY/uTLS only with that
      # tag; the production image and release binaries use it as well.
      - name: Test
        run: go test -tags with_utls ./... -count=1 -timeout 600s

  ui-e2e:
    name: UI e2e (Playwright)
    needs: test
    runs-on: instabox-medium
    env:
      ADMIN_PASSWORD: e2e-admin-pass
      ADMIN_ADDR: 127.0.0.1:7788
      BASE_URL: http://127.0.0.1:7788
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # Build web -> admin/dist (go:embed), build binary, boot it on a fresh DB,
      # install chromium, run web/e2e against the real backend. Same script we
      # run locally via instabox, so CI and local verification cannot drift.
      - name: Build, boot and run Playwright
        run: bash scripts/ui-e2e-ci.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: instabox-medium
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

  release:
    name: Release binaries
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: instabox-medium
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build web (shadcn UI)
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Build binaries
        run: |
          mkdir -p dist
          for pair in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            os=${pair%-*}; arch=${pair#*-}; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags with_utls -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/fastproxy-$pair$ext" .
          done
          cd dist
          for f in fastproxy-*; do tar -czf "$f.tar.gz" "$f" && rm -f "$f"; done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *rc*|*beta*|*alpha*|*dev*) PRERELEASE="--prerelease";; esac
          cat > /tmp/release-notes.md <<EOF
          FastProxy $GITHUB_REF_NAME — 多端口、多账户、上游代理转发的 HTTP/SOCKS5 转发器

          - 上游：HTTP / SOCKS5 / Shadowsocks / VLESS（TCP/TLS、REALITY、Vision、WS、gRPC）/ VMess
          - 内置 sing-box 出站（REALITY / Vision / WS / gRPC / VMess AEAD）
          - 批量检测：并发数可设置（1-32），每行实时更新状态、延迟与出口 IP
          - 导入：ss:// vless:// vmess:// 分享链接、Clash、sing-box JSON、base64 订阅
          - 面板：分页 + 批量操作、上游健康探测、连接日志、JSON 打印、一键复制配置

          Docker: docker pull ghcr.io/${{ github.repository }}:$GITHUB_REF_NAME
          EOF
          gh release create "$GITHUB_REF_NAME" $PRERELEASE dist/*.tar.gz \
            --title "FastProxy $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
